# NikOS post-install launcher for Xubuntu 24.04.
#
# This image remains a stock Xubuntu installation image. It deliberately does
# not run NikOS, Ansible, or package installation while the ISO is being built.
# After Xubuntu is installed and rebooted, "Install NikOS" starts the native
# NikOS installer, which asks the user to select optional bundles and writes
# the resulting configuration on the installed machine.
#
# Build against an already-downloaded base image:
#   sudo ./forge --recipe recipes/nikos.yml \
#     --base-iso "$HOME/Downloads/iso_images/xubuntu-24.04.4-desktop-amd64.iso"
recipe: nikos-postinstall-xubuntu

base:
  catalog_id: Xubuntu_24_04_4_desktop_amd64

compatibility:
  base_filename_patterns:
    - '^xubuntu-24\.04\.[0-9]+-desktop-amd64\.iso$'

output:
  name: nikos-xubuntu-24.04-amd64
  volume_id: NIKOS_XUBUNTU_2404
  label: NikOS installer for Xubuntu 24.04

overlay:
  - src: overlay/nikos-installer
    dest: /
