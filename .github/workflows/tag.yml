name: Tag Release

# On a merge of a `release/X.Y.Z` branch, tag X.Y.Z and start release.yml for
# it. The tag is pushed with GITHUB_TOKEN, which does not trigger tag-push
# workflows, so the release has to be dispatched. Nothing tagged this
# repository before, so 1.1.0 to 2.2.2 have no tag or release.

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  actions: write

jobs:
  tag:
    uses: nikolareljin/ci-helpers/.github/workflows/auto-tag-release.yml@production
    with:
      update_production_tag: false
      release_workflow: release.yml
