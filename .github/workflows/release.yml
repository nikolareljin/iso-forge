name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release (e.g. 2.3.0). Leave empty to use the pushed tag."
        required: false
        default: ""
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-rc*'
      - '[0-9]*.[0-9]*.[0-9]*-RC*'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

# Read by default; write only for the jobs whose callees upload to the release.
permissions:
  contents: read

# One entry point for a release: tag.yml dispatches this file for a new tag
# (a tag pushed by a workflow starts nothing else), and every package is built
# here after the GitHub Release exists.

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [[ -z "$tag" && "$REF_TYPE" == "tag" ]]; then tag="$REF_NAME"; fi
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(rc|RC)[0-9.]*)?$ ]] || { echo "::error::not a release tag: '$tag'"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: resolve
    permissions:
      contents: write
    uses: nikolareljin/ci-helpers/.github/workflows/create-github-release.yml@production
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}

  deb:
    needs: [resolve, release]
    permissions:
      contents: write
    uses: nikolareljin/ci-helpers/.github/workflows/deb-build.yml@production
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      working_directory: "."
      prebuild_command: "git submodule update --init --recursive && ./tools/gen-man.sh"
      # dpkg-buildpackage writes the .deb to the parent of the source
      # directory, which is outside the workspace, and upload-artifact refuses
      # a path containing "..": `Invalid pattern '../*.deb'`. So build, then
      # move the artifacts somewhere inside it. The command replaces the
      # helper's default, which is plain `dpkg-buildpackage -us -uc`.
      build_command: "dpkg-buildpackage -us -uc && mkdir -p dist && mv ../*.deb dist/"
      artifact_glob: "dist/*.deb"

  ppa:
    needs: [resolve, release]
    if: ${{ vars.PPA_PUBLISH_ENABLED == 'true' }}
    uses: nikolareljin/ci-helpers/.github/workflows/ppa-deb.yml@production
    with:
      working_directory: "."
      prebuild_command: "git submodule update --init --recursive && ./tools/gen-man.sh"
      ppa_target: "ppa:nikolareljin/isoforge"
      deb_fullname: "Nikola Reljin"
      deb_email: "nikola.reljin@gmail.com"
      signing_key_id: ${{ vars.PPA_GPG_KEY_ID }}
    secrets:
      gpg_private_key: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
      gpg_passphrase: ${{ secrets.PPA_GPG_PASSPHRASE }}
      launchpad_ssh_private_key: ${{ secrets.PPA_SSH_PRIVATE_KEY }}

  rpm:
    needs: [resolve, release]
    uses: nikolareljin/ci-helpers/.github/workflows/rpm-build.yml@production
    with:
      # Plain ".". The absolute path this used to carry was an attempt to work
      # around rpm-build.yml passing working_directory straight into rpmbuild's
      # _topdir, which has to be absolute. It could not work: a workflow_call
      # `with:` block is evaluated before any runner exists, so github.workspace
      # is the empty string here and the spec was looked for at
      # /packaging/isoforge.spec. ci-helpers 0.22.1 takes _topdir from pwd
      # instead, so the input is just a directory again.
      working_directory: "."
      prebuild_command: "git submodule update --init --recursive && ./tools/gen-man.sh"
      spec_path: "packaging/isoforge.spec"
      artifact_glob: "dist/*.rpm"

  brew:
    needs: [resolve, release]
    permissions:
      contents: write
    uses: nikolareljin/ci-helpers/.github/workflows/homebrew-package.yml@production
    with:
      working_directory: "."
      prebuild_command: "git submodule update --init --recursive && ./tools/gen-man.sh"
      name: "isoforge"
      desc: "TUI tool for downloading and flashing ISO images to USB"
      homepage: "https://github.com/nikolareljin/iso-forge"
      deps: "dialog,jq,curl"
      entrypoint: "inc/isoforge.sh"
      man_path: "docs/man/isoforge.1"
      use_libexec: "true"
      env_var: "ISOFORGE_ROOT"
      exclude_paths: ".git,.github,dist,.deps_install.log,.tmp_config.json,.mockbin,test_downloads"
      release_tag: ${{ needs.resolve.outputs.tag }}
      publish: "true"
    secrets:
      tap_repo: ${{ secrets.HOMEBREW_TAP_REPO }}
      tap_deploy_key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
