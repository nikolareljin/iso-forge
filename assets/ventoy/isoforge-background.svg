<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Dark Forge Background Gradient -->
    <linearGradient id="forgeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#171e2e"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <!-- Hot Orange Accent Gradient -->
    <linearGradient id="emberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff4500"/>
      <stop offset="60%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>

    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="emberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#forgeBg)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1920" height="5" fill="url(#emberGrad)"/>

  <!-- Decorative Hex Grid Accent (Left Side) -->
  <g stroke="#334155" stroke-width="1" fill="none" opacity="0.25" transform="translate(-50, 100)">
    <path d="M 100 0 L 150 30 L 150 90 L 100 120 L 50 90 L 50 30 Z"/>
    <path d="M 200 0 L 250 30 L 250 90 L 200 120 L 150 90 L 150 30 Z"/>
    <path d="M 150 90 L 200 120 L 200 180 L 150 210 L 100 180 L 100 120 Z"/>
  </g>

  <!-- Header / Branding Block (Top Centered) -->
  <g transform="translate(960, 150)">
    <!-- Scale Down Emblem for Header Placement -->
    <g transform="translate(0, -20) scale(0.45)">
      <!-- Disc -->
      <circle cx="0" cy="0" r="140" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="14 6"/>
      <!-- Anvil -->
      <path d="M -80 50 L 80 50 L 70 20 L 40 20 L 40 -10 L 90 -10 C 95 -10 100 -20 90 -25 L 60 -40 L -50 -40 C -70 -40 -80 -25 -80 -10 L -30 -10 L -30 20 L -60 20 Z" fill="url(#metalGrad)" stroke="#94a3b8" stroke-width="2"/>
      <!-- Flame -->
      <path d="M 0 -110 C -15 -80 -30 -60 -30 -30 C -30 -10 -15 0 0 0 C 15 0 30 -10 30 -30 C 30 -60 15 -80 0 -110 Z" fill="url(#flameGrad)" filter="url(#emberGlow)"/>
    </g>

    <!-- Branding Text -->
    <text x="0" y="80" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="52" fill="#f8fafc" letter-spacing="6">ISO-FORGE</text>
    <text x="0" y="110" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="14" fill="#f97316" letter-spacing="8">AUTOMATED ISO &amp; ANSIBLE DEPLOYMENT</text>
  </g>

  <!-- Subtle Flame Spark Embers (Bottom Corners) -->
  <circle cx="200" cy="900" r="3" fill="#f97316" opacity="0.6" filter="url(#emberGlow)"/>
  <circle cx="280" cy="820" r="2" fill="#eab308" opacity="0.8"/>
  <circle cx="1650" cy="880" r="4" fill="#f97316" opacity="0.5" filter="url(#emberGlow)"/>
  <circle cx="1720" cy="940" r="2" fill="#ef4444" opacity="0.7"/>

  <!-- Ventoy Boot Frame Indicator Line (Bottom Center) -->
  <path d="M 660 980 L 1260 980" stroke="#334155" stroke-width="2" stroke-dasharray="10 10"/>
  <text x="960" y="1010" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="400" font-size="12" fill="#475569" letter-spacing="3">VENTOY BOOT SYSTEM</text>
</svg>
